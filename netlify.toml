[build]
  command = "npm install --legacy-peer-deps && CI= npx react-scripts build"
  publish = "build"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "connect-src *; default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/api/*"
  to = "https://yfetdazutkxvaixbhnok.supabase.co/:splat"
  status = 200
  force = true
