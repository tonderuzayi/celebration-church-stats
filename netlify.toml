[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.supabase.co https://api.emailjs.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com;"

[build]
  command = "npm install --legacy-peer-deps && CI= npx react-scripts build"
  publish = "build"
